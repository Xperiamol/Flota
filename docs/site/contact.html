<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flota - 联系作者</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/logo.png">
    <style>
        :root {
            --bg: #faf9f6;
            --card: #ffffff;
            --text: #18181a;
            --muted: #52525b;
            --border: #eaeaea;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, sans-serif;
            line-height: 1.7;
        }

        .wrap {
            max-width: 840px;
            margin: 0 auto;
            padding: 48px 20px 64px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            color: var(--muted);
        }

        .top-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--text);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 8px 14px;
            background: #fff;
        }

        .top-link:hover {
            background: #f4f4f5;
        }

        .list {
            margin-top: 20px;
            display: grid;
            gap: 12px;
        }

        .item {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            background: #fff;
        }

        .label {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 2px;
        }

        .value a {
            color: #18181a;
            text-decoration: none;
        }

        .value a:hover {
            text-decoration: underline;
        }

        .meta {
            color: #a1a1aa;
            font-size: 13px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <main class="wrap">
        <a class="top-link" href="index.html">返回首页</a>
        <article class="card">
            <h1>联系作者</h1>
            <p>欢迎提交建议、问题反馈、合作沟通或功能需求。为了更快处理，请尽量附上系统环境、版本号和复现步骤。</p>

            <div class="list">
                <div class="item">
                    <div class="label">GitHub</div>
                    <div class="value"><a href="https://github.com/Xperiamol/Flota" target="_blank" rel="noopener noreferrer">github.com/Xperiamol/Flota</a></div>
                </div>
                <div class="item">
                    <div class="label">电子邮箱</div>
                    <div class="value"><a href="mailto:1986717659@qq.com">1986717659@qq.com</a></div>
                </div>
            </div>

            <p class="meta">响应时间：通常 1-3 个工作日</p>
        </article>
    </main>
</body>
</html>
