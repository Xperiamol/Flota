name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Linux 打包 AppImage 需要额外工具
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools rpm

      # macOS：用 logo.png 生成 logo.icns（electron-builder 需要）
      - name: Generate logo.icns (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p build
          mkdir -p /tmp/logo.iconset
          sips -z 16 16   logo.png --out /tmp/logo.iconset/icon_16x16.png
          sips -z 32 32   logo.png --out /tmp/logo.iconset/icon_16x16@2x.png
          sips -z 32 32   logo.png --out /tmp/logo.iconset/icon_32x32.png
          sips -z 64 64   logo.png --out /tmp/logo.iconset/icon_32x32@2x.png
          sips -z 128 128 logo.png --out /tmp/logo.iconset/icon_128x128.png
          sips -z 256 256 logo.png --out /tmp/logo.iconset/icon_128x128@2x.png
          sips -z 256 256 logo.png --out /tmp/logo.iconset/icon_256x256.png
          sips -z 512 512 logo.png --out /tmp/logo.iconset/icon_256x256@2x.png
          sips -z 512 512 logo.png --out /tmp/logo.iconset/icon_512x512.png
          cp logo.png /tmp/logo.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/logo.iconset -o build/logo.icns

      # 为 Electron 重新编译 better-sqlite3（使用 electron-rebuild）
      - name: Rebuild better-sqlite3 for Electron
        run: npx electron-rebuild -f -w better-sqlite3

      # 预检查模型（模型已在 git 里，会跳过下载）
      - name: Pre-build (models check)
        run: npm run pre-build

      # Vite 打包前端
      - name: Build frontend
        run: npm run build

      # 仅在 Linux 构建 MCP 独立分发包（跨平台无关，构建一次即可）
      - name: Package MCP Server (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: npm run package-mcp

      # electron-builder 打包（--publish never 禁止它自己上传，由下面统一发布）
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # Microsoft Store 包（商店名「Flota Notes」，身份见 package.json 的 build.appx）：
      # 直接用上一步打好的 win-unpacked，不重新打包。appx 不签名，上传到 Partner Center 后由商店签名。
      # 失败也不影响 exe 的发布。
      - name: Package Microsoft Store (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: npx electron-builder --win appx --prepackaged dist-electron/win-unpacked --publish never

      # 商店包单独存一份，方便下载后上传到 Partner Center（不放进 GitHub Release：未签名的 appx 用户装不了）
      - name: Upload Microsoft Store package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flota-microsoft-store-${{ github.ref_name }}
          path: dist-electron/*.appx
          if-no-files-found: ignore

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      # 上传构建产物（手动触发时保存为 Artifacts，90天过期）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flota-${{ matrix.platform }}-${{ github.ref_name }}
          path: dist-electron/
          if-no-files-found: warn

      # 推 tag 时自动发布到 GitHub Releases
      - name: Generate release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm run release:notes -- --version="$VERSION" --out=release-notes.md

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.blockmap
            dist-electron/latest*.yml
            dist-electron/mcp-server.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-oss:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
      OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_PUBLIC_BASE_URL: ${{ secrets.OSS_PUBLIC_BASE_URL }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Flota-*-${{ github.ref_name }}
          merge-multiple: true
          path: release-files

      - name: Prepare release files for OSS
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p oss-staging/downloads/latest
          mkdir -p "oss-staging/downloads/v${VERSION}"

          WIN_SETUP="$(find release-files -type f -name '*Setup*.exe' | head -n1 || true)"
          MAC_ARM64="$(find release-files -type f -name '*arm64*.dmg' | head -n1 || true)"
          MAC_X64="$(find release-files -type f -name '*.dmg' ! -name '*arm64*' | head -n1 || true)"
          LINUX_APPIMAGE="$(find release-files -type f -name '*.AppImage' | head -n1 || true)"
          MCP_ZIP="$(find release-files -type f -name 'mcp-server.zip' | head -n1 || true)"

          if [[ -z "$WIN_SETUP" || -z "$MAC_ARM64" || -z "$MAC_X64" || -z "$LINUX_APPIMAGE" ]]; then
            echo "[publish-oss] Missing one or more required desktop artifacts"
            echo "WIN_SETUP=$WIN_SETUP"
            echo "MAC_ARM64=$MAC_ARM64"
            echo "MAC_X64=$MAC_X64"
            echo "LINUX_APPIMAGE=$LINUX_APPIMAGE"
            exit 1
          fi

          cp "$WIN_SETUP" "oss-staging/downloads/v${VERSION}/Flota.Setup.${VERSION}.exe"
          cp "$MAC_X64" "oss-staging/downloads/v${VERSION}/Flota-${VERSION}.dmg"
          cp "$MAC_ARM64" "oss-staging/downloads/v${VERSION}/Flota-${VERSION}-arm64.dmg"
          cp "$LINUX_APPIMAGE" "oss-staging/downloads/v${VERSION}/Flota-${VERSION}.AppImage"

          cp "$WIN_SETUP" "oss-staging/downloads/latest/Flota.Setup.exe"
          cp "$MAC_X64" "oss-staging/downloads/latest/Flota-mac-x64.dmg"
          cp "$MAC_ARM64" "oss-staging/downloads/latest/Flota-mac-arm64.dmg"
          cp "$LINUX_APPIMAGE" "oss-staging/downloads/latest/Flota.AppImage"

          if [[ -n "$MCP_ZIP" ]]; then
            cp "$MCP_ZIP" "oss-staging/downloads/v${VERSION}/mcp-server.zip"
            cp "$MCP_ZIP" "oss-staging/downloads/latest/mcp-server.zip"
          fi

          BASE_URL="${OSS_PUBLIC_BASE_URL%/}"
          if [[ -z "$BASE_URL" ]]; then
            BASE_URL="https://${OSS_BUCKET}.oss-${OSS_ENDPOINT}.aliyuncs.com"
          fi

          cat > "oss-staging/downloads/release-manifest.json" <<EOF
          {
            "version": "${VERSION}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "latest": {
              "windows": "${BASE_URL}/downloads/latest/Flota.Setup.exe",
              "macosX64": "${BASE_URL}/downloads/latest/Flota-mac-x64.dmg",
              "macosArm64": "${BASE_URL}/downloads/latest/Flota-mac-arm64.dmg",
              "linux": "${BASE_URL}/downloads/latest/Flota.AppImage",
              "android": "${BASE_URL}/downloads/latest/app-release.apk"
            },
            "versioned": {
              "windows": "${BASE_URL}/downloads/v${VERSION}/Flota.Setup.${VERSION}.exe",
              "macosX64": "${BASE_URL}/downloads/v${VERSION}/Flota-${VERSION}.dmg",
              "macosArm64": "${BASE_URL}/downloads/v${VERSION}/Flota-${VERSION}-arm64.dmg",
              "linux": "${BASE_URL}/downloads/v${VERSION}/Flota-${VERSION}.AppImage"
            }
          }
          EOF

      - name: Setup Python for OSS upload
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OSS Python SDK
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install oss2

      - name: Upload to OSS
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OSS_BUCKET" || -z "$OSS_ENDPOINT" || -z "$OSS_ACCESS_KEY_ID" || -z "$OSS_ACCESS_KEY_SECRET" ]]; then
            echo "[publish-oss] OSS secrets are not fully configured"
            exit 1
          fi

          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          import hashlib
          import mimetypes
          import time
          import oss2

          bucket_name = os.environ.get("OSS_BUCKET", "")
          endpoint = os.environ.get("OSS_ENDPOINT", "")
          access_key_id = os.environ.get("OSS_ACCESS_KEY_ID", "")
          access_key_secret = os.environ.get("OSS_ACCESS_KEY_SECRET", "")

          source_root = Path("oss-staging/downloads")
          if not source_root.exists():
              print(f"[publish-oss] source directory not found: {source_root}")
              sys.exit(1)

          auth = oss2.Auth(access_key_id, access_key_secret)
          # GitHub 的机器在海外，传到 OSS 很慢：以前整个安装包一次 PUT、60 秒读超时、不重试，
          # 一次超时整个发布就失败（v4.1.2）。现在大文件分片、断点续传，每个文件最多重试 3 次。
          bucket = oss2.Bucket(auth, endpoint, bucket_name, connect_timeout=120)
          resume_store = oss2.ResumableStore(root="/tmp/oss-resume")

          def upload(object_key, path, headers):
              for attempt in range(1, 4):
                  try:
                      oss2.resumable_upload(
                          bucket, object_key, str(path), store=resume_store, headers=headers,
                          multipart_threshold=8 * 1024 * 1024, part_size=4 * 1024 * 1024, num_threads=4,
                      )
                      return
                  except (oss2.exceptions.RequestError, oss2.exceptions.ServerError) as error:
                      if attempt == 3:
                          raise
                      print(f"[publish-oss] retry {attempt} for {object_key}: {error}")
                      time.sleep(15 * attempt)

          def file_digest(path):
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          # 先传带版本号的文件，再传 latest/（同一个安装包在 OSS 内部复制，不再从这里传第二遍），
          # 最后才更新 release-manifest.json：客户端看到新版本时，安装包一定已经在了
          def order(path):
              key = path.as_posix()
              if key.endswith("release-manifest.json"):
                  return (2, key)
              return (1 if "/latest/" in key else 0, key)

          uploaded = 0
          uploaded_by_digest = {}
          for local_path in sorted((p for p in source_root.rglob("*") if p.is_file()), key=order):
              object_key = local_path.as_posix().replace("oss-staging/", "", 1)
              content_type, _ = mimetypes.guess_type(str(local_path))
              headers = {}
              if content_type:
                  headers["Content-Type"] = content_type

              digest = file_digest(local_path)
              source_key = uploaded_by_digest.get(digest)
              if source_key:
                  bucket.copy_object(bucket_name, source_key, object_key)
                  print(f"[publish-oss] copied: {source_key} -> {object_key}")
              else:
                  upload(object_key, local_path, headers)
                  uploaded_by_digest[digest] = object_key
                  print(f"[publish-oss] uploaded: {object_key}")
              uploaded += 1

          print(f"[publish-oss] upload complete, total files: {uploaded}")
          PY
